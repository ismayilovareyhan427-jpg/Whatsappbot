# İşə salmaq: docker compose up -d --build   (əvvəl: npm i ioredis)
services:
  api:
    build: .
    restart: unless-stopped
    env_file: ./config/config.env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
